[package]
name = "truedeck-pty"
version = "0.1.0"
edition = "2021"
description = "Fast PTY host sidecar for TrueDeck (JSON-lines over stdio)"
license = "MIT"
publish = false

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.22"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
