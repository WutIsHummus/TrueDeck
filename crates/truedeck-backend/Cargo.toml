[package]
name = "truedeck-backend"
version = "0.1.0"
edition = "2021"
description = "TrueDeck native backend — PTY, projects, settings, memory inject"
license = "MIT"
publish = false

[[bin]]
name = "truedeck-backend"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.22"
parking_lot = "0.12"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
