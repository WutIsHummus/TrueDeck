<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="TrueDeck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="50%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc078"/>
      <stop offset="100%" stop-color="#f0a050"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f0a05033"/>
      <stop offset="60%" stop-color="#60a5fa15"/>
      <stop offset="100%" stop-color="#00000000"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- grid lines -->
  <g stroke="#ffffff06" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M213 0 V640 M426 0 V640 M640 0 V640 M853 0 V640 M1066 0 V640"/>
  </g>

  <!-- logo mark (Claude/Codex-vibe app icon) -->
  <g transform="translate(96,120)">
    <rect width="96" height="96" rx="26" fill="#1a1614" stroke="#ffffff12" stroke-width="2"/>
    <rect x="22" y="28" width="32" height="8" rx="4" fill="#f0a050" opacity="0.35"/>
    <rect x="22" y="42" width="36" height="8" rx="4" fill="#f0a050" opacity="0.65"/>
    <rect x="22" y="56" width="28" height="8" rx="4" fill="#f0a050"/>
    <circle cx="70" cy="46" r="12" fill="#0e0c12" stroke="#60a5fa" stroke-width="3.5"/>
    <circle cx="70" cy="46" r="4.5" fill="#60a5fa"/>
    <path d="M58 46 H62" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="220" y="168" font-family="Segoe UI,system-ui,sans-serif" font-size="64" font-weight="700" fill="#e8e8e8" letter-spacing="-1">TrueDeck</text>
  <text x="224" y="210" font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#f0a050">v0.3.0</text>
  <text x="220" y="270" font-family="Segoe UI,system-ui,sans-serif" font-size="28" fill="#a1a1aa" width="700">
    Terminal-first multi-agent coding deck
  </text>
  <text x="220" y="312" font-family="Segoe UI,system-ui,sans-serif" font-size="20" fill="#71717a">
    Grok · Codex · Cursor · Claude — automatic memory, no Docker
  </text>

  <!-- feature pills -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="16">
    <rect x="220" y="360" width="180" height="40" rx="20" fill="#ffffff08" stroke="#ffffff18"/>
    <text x="248" y="386" fill="#e8e8e8">Ctrl+Shift+A</text>
    <rect x="416" y="360" width="140" height="40" rx="20" fill="#ffffff08" stroke="#60a5fa44"/>
    <text x="448" y="386" fill="#93c5fd">Cursor</text>
    <rect x="572" y="360" width="160" height="40" rx="20" fill="#ffffff08" stroke="#f0a05044"/>
    <text x="600" y="386" fill="#ffc078">mem·auto</text>
    <rect x="748" y="360" width="150" height="40" rx="20" fill="#ffffff08" stroke="#ffffff18"/>
    <text x="780" y="386" fill="#e8e8e8">onboarding</text>
  </g>

  <!-- window mock right -->
  <g transform="translate(780,120)">
    <rect width="420" height="400" rx="14" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="2"/>
    <rect width="420" height="36" rx="14" fill="#141414"/>
    <rect y="22" width="420" height="14" fill="#141414"/>
    <text x="16" y="24" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#f0a050" font-weight="700">TRUEDECK</text>
    <rect x="110" y="10" width="120" height="18" rx="9" fill="#ffffff08" stroke="#2a2a2a"/>
    <text x="120" y="23" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8a8a8a">~/SPTS</text>
    <text x="300" y="23" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8a8a8a">mem·auto</text>
    <rect x="360" y="8" width="48" height="20" rx="10" fill="#60a5fa22" stroke="#60a5fa66"/>
    <text x="370" y="22" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#93c5fd">Cursor</text>

    <!-- tabs -->
    <rect y="36" width="420" height="32" fill="#141414"/>
    <rect x="8" y="40" width="70" height="24" rx="6" fill="#0c0c0c" stroke="#2a2a2a"/>
    <text x="22" y="56" font-family="Segoe UI,sans-serif" font-size="11" fill="#e8e8e8">Grok</text>
    <rect x="84" y="40" width="78" height="24" rx="6" fill="#0c0c0c" stroke="#60a5fa66"/>
    <text x="98" y="56" font-family="Segoe UI,sans-serif" font-size="11" fill="#93c5fd">Cursor</text>
    <text x="180" y="56" font-family="Segoe UI,sans-serif" font-size="14" fill="#8a8a8a">+</text>

    <!-- terminal body -->
    <rect y="68" width="420" height="300" fill="#0c0c0c"/>
    <text x="20" y="100" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#f0a050">›_</text>
    <text x="40" y="100" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#a1a1aa">cursor-agent</text>
    <text x="20" y="130" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#52525b">Reading .truedeck/auto-context.md…</text>
    <text x="20" y="155" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#7fd99a">Memory automatic · wing spts</text>
    <text x="20" y="190" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#71717a">How can I help with this repo?</text>

    <!-- status -->
    <rect y="368" width="420" height="32" fill="#141414"/>
    <text x="12" y="388" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#71717a">Ctrl+Shift+A agents · Ctrl+Shift+O project</text>
  </g>

  <text x="96" y="600" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="#52525b">github.com/WutIsHummus/TrueDeck</text>
</svg>
