<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="TrueDeck studio UI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101012"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="620" rx="12" fill="url(#bg)" stroke="#2a2a2a" stroke-width="2"/>

  <!-- titlebar -->
  <rect x="1" y="1" width="1098" height="40" rx="12" fill="#141414"/>
  <rect x="1" y="28" width="1098" height="14" fill="#141414"/>
  <text x="16" y="26" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" fill="#f0a050">TRUEDECK</text>
  <!-- project menu (VS Code style) -->
  <rect x="120" y="10" width="100" height="22" rx="4" fill="#ffffff10"/>
  <text x="132" y="25" font-family="Segoe UI,sans-serif" font-size="12" fill="#e8e8e8">SPTS ▾</text>
  <text x="1020" y="26" fill="#8a8a8a" font-size="14">⚙</text>
  <text x="1045" y="26" fill="#8a8a8a" font-size="14">?</text>

  <!-- layout toolbar -->
  <rect y="41" width="1100" height="28" fill="#141414"/>
  <text x="12" y="59" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#71717a">Drag tab → Left / Right / Top / Bottom · ▥ ▤ merge +</text>

  <!-- two groups side by side -->
  <rect y="69" width="548" height="34" fill="#101010"/>
  <rect x="8" y="76" width="18" height="18" rx="4" fill="#f0a05022"/>
  <text x="12" y="89" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="700" fill="#f0a050">A</text>
  <rect x="32" y="74" width="80" height="24" rx="6" fill="#0c0c0c" stroke="#f0a05055"/>
  <circle cx="46" cy="86" r="3.5" fill="#60a5fa"/>
  <text x="56" y="90" font-family="Segoe UI,sans-serif" font-size="12" fill="#e8e8e8">Cursor</text>

  <rect x="552" y="69" width="548" height="34" fill="#101010"/>
  <rect x="560" y="76" width="18" height="18" rx="4" fill="#60a5fa22"/>
  <text x="564" y="89" font-family="ui-monospace,Consolas,monospace" font-size="10" font-weight="700" fill="#60a5fa">B</text>
  <rect x="584" y="74" width="72" height="24" rx="6" fill="#0c0c0c" stroke="#60a5fa55"/>
  <circle cx="598" cy="86" r="3.5" fill="#22d3ee"/>
  <text x="608" y="90" font-family="Segoe UI,sans-serif" font-size="12" fill="#e8e8e8">Grok</text>

  <!-- terminals -->
  <rect y="103" width="548" height="484" fill="#0c0c0c"/>
  <rect x="549" y="103" width="3" height="484" fill="#2a2a2a"/>
  <rect x="552" y="103" width="548" height="484" fill="#0c0c0c"/>

  <text x="20" y="140" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#f0a050">›</text>
  <text x="36" y="140" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#e8e8e8">cursor-agent</text>
  <text x="20" y="170" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#52525b">Reading .truedeck/auto-context.md…</text>
  <text x="20" y="200" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#7fd99a">Memory wired into Cursor · Group A</text>

  <text x="572" y="140" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#f0a050">›</text>
  <text x="588" y="140" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#e8e8e8">grok</text>
  <text x="572" y="170" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#52525b">Group B · side-by-side split</text>

  <!-- statusbar -->
  <rect y="587" width="1100" height="32" fill="#141414"/>
  <text x="12" y="608" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#71717a">Ctrl+A agents · Ctrl+O project · Ctrl+W close · Ctrl+X split down · Ctrl+Shift+X side</text>
  <text x="980" y="608" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#52525b">Ready</text>
</svg>
