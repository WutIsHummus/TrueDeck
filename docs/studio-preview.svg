  <text x="12" y="608" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#71717a">Ctrl+Shift+A agents · Ctrl+Shift+O project · Ctrl+Shift+W close · Ctrl+Shift+S settings</text>
  <text x="900" y="608" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#52525b">mem·auto · Ready</text>
