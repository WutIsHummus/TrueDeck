  <text x="32" y="64" font-family="Segoe UI,sans-serif" font-size="12" fill="#e8e8e8">Grok</text>
  <text x="78" y="64" font-family="Segoe UI,sans-serif" font-size="12" fill="#8a8a8a">×</text>

  <rect x="102" y="47" width="100" height="26" rx="6" fill="#0c0c0c" stroke="#60a5fa55"/>
  <circle cx="116" cy="60" r="3.5" fill="#60a5fa"/>
  <text x="126" y="64" font-family="Segoe UI,sans-serif" font-size="12" fill="#93c5fd">Cursor</text>
  <text x="182" y="64" font-family="Segoe UI,sans-serif" font-size="12" fill="#8a8a8a">×</text>

  <rect x="208" y="47" width="96" height="26" rx="6" fill="#0c0c0c" stroke="#2a2a2a"/>
  <circle cx="222" cy="60" r="3.5" fill="#34d399"/>
  <text x="232" y="64" font-family="Segoe UI,sans-serif" font-size="12" fill="#a1a1aa">Codex</text>
