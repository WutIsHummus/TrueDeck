    <rect x="940" y="10" width="70" height="22" rx="11" fill="#ffffff10" stroke="#3f3f3f"/>
    <text x="952" y="25" fill="#e8e8e8">+ agent</text>
    <text x="1025" y="26" fill="#8a8a8a" font-size="14">⚙</text>
    <text x="1050" y="26" fill="#8a8a8a" font-size="14">?</text>
