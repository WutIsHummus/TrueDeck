  <text x="320" y="64" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#8a8a8a">+</text>
  <text x="345" y="64" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#71717a">clear</text>

