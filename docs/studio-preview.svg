  <text x="20" y="215" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#7fd99a">✓ Memory automatic — no Docker</text>
  <text x="20" y="255" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#71717a">What should we work on?</text>
  <text x="20" y="290" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#e8e8e8">_</text>

  <!-- statusbar -->
