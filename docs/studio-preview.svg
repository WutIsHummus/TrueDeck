  <text x="560" y="25" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#8a8a8a">mem·auto</text>

  <!-- quick agents -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="11">
    <rect x="680" y="10" width="52" height="22" rx="11" fill="#ffffff06" stroke="#2a2a2a"/>
    <text x="694" y="25" fill="#a1a1aa">Grok</text>
    <rect x="738" y="10" width="58" height="22" rx="11" fill="#ffffff06" stroke="#2a2a2a"/>
