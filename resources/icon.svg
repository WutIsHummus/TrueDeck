<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TrueDeck">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1c"/>
      <stop offset="55%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc078"/>
      <stop offset="100%" stop-color="#f0a050"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#14171e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#ffffff12" stroke-width="1.5"/>

  <!-- Back panes (multi-agent deck) -->
  <g opacity="0.55">
    <rect x="28" y="24" width="72" height="52" rx="8" fill="#1a1d24" stroke="#ffffff10" stroke-width="1" transform="rotate(-6 64 50)"/>
  </g>
  <g opacity="0.75">
    <rect x="26" y="28" width="76" height="56" rx="9" fill="#1c2028" stroke="#ffffff14" stroke-width="1" transform="rotate(4 64 56)"/>
  </g>

  <!-- Front terminal pane -->
  <rect x="24" y="34" width="80" height="58" rx="10" fill="url(#pane)" stroke="#ffffff18" stroke-width="1.25"/>
  <!-- title bar -->
  <rect x="24" y="34" width="80" height="14" rx="10" fill="#ffffff08"/>
  <rect x="24" y="42" width="80" height="6" fill="#ffffff06"/>
  <circle cx="34" cy="41" r="2.2" fill="#f07178"/>
  <circle cx="42" cy="41" r="2.2" fill="#f0a050"/>
  <circle cx="50" cy="41" r="2.2" fill="#7fd99a"/>

  <!-- prompt line -->
  <g filter="url(#glow)">
    <text x="34" y="68" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="url(#amber)">›_</text>
  </g>
  <!-- agent activity bars -->
  <rect x="52" y="60" width="28" height="3.5" rx="1.75" fill="url(#cyan)" opacity="0.95"/>
  <rect x="52" y="68" width="40" height="3.5" rx="1.75" fill="#ffffff22"/>
  <rect x="52" y="76" width="22" height="3.5" rx="1.75" fill="#ffffff16"/>

  <!-- floating agent nodes -->
  <g filter="url(#glow)">
    <circle cx="96" cy="30" r="7" fill="#0c0c0e" stroke="url(#cyan)" stroke-width="2"/>
    <circle cx="96" cy="30" r="2.5" fill="url(#cyan)"/>
    <circle cx="108" cy="52" r="6" fill="#0c0c0e" stroke="url(#amber)" stroke-width="2"/>
    <circle cx="108" cy="52" r="2.2" fill="url(#amber)"/>
    <circle cx="22" cy="86" r="5.5" fill="#0c0c0e" stroke="#c084fc" stroke-width="1.75"/>
    <circle cx="22" cy="86" r="2" fill="#c084fc"/>
  </g>

  <!-- TD monogram mark -->
  <text x="64" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#ffffff55">TD</text>
</svg>
