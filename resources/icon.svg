<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TrueDeck">
  <!--
    TrueDeck app icon — Claude / Codex vibe:
    soft squircle, single bold mark, warm + cool accent, reads at 16px.
  -->
  <defs>
    <linearGradient id="plate" x1="18%" y1="8%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#2a211c"/>
      <stop offset="45%" stop-color="#1a1614"/>
      <stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="mark" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffd0a1"/>
      <stop offset="55%" stop-color="#f0a050"/>
      <stop offset="100%" stop-color="#e8943a"/>
    </linearGradient>
    <linearGradient id="cool" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Squircle plate (app-icon silhouette) -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#plate)"/>
  <!-- subtle rim -->
  <rect x="9" y="9" width="110" height="110" rx="29" fill="none" stroke="#ffffff10" stroke-width="1"/>

  <!--
    Abstract "deck" mark:
    three soft bars = multi-agent panes,
    a single upright stem + bloom = active agent / prompt cursor.
    Intentionally simple like Claude/Codex marks.
  -->
  <g transform="translate(64 66)">
    <!-- stacked deck strokes -->
    <rect x="-28" y="-22" width="42" height="10" rx="5" fill="url(#mark)" opacity="0.35"/>
    <rect x="-28" y="-8" width="48" height="10" rx="5" fill="url(#mark)" opacity="0.6"/>
    <rect x="-28" y="6" width="36" height="10" rx="5" fill="url(#mark)"/>

    <!-- active agent node (cool accent, Codex-clean) -->
    <circle cx="26" cy="-2" r="11" fill="#0e0c12" stroke="url(#cool)" stroke-width="3.5"/>
    <circle cx="26" cy="-2" r="4.5" fill="url(#cool)"/>

    <!-- micro connector -->
    <path d="M8 -2 H15" stroke="url(#cool)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
