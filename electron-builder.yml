appId: dev.truedeck.app
productName: TrueDeck
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
  - resources/**/*
win:
  icon: resources/icon.svg
  target:
    - nsis
    - portable
mac:
  icon: resources/icon.svg
linux:
  icon: resources/icon.svg

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
