name: Release

# Package installers on Windows + macOS (and optionally attach to a GitHub Release).
# Trigger: push tag v*  OR  workflow_dispatch (artifacts always; optional upload to a tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach assets to (e.g. v0.3.2). Leave empty for artifacts only.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            electron_args: --win --x64
            artifact: TrueDeck-windows-x64
            rust_target: ''
          # Both Mac archs on macos-latest (arm64 host). Avoid macos-13 queue starvation.
          - name: macos-arm64
            os: macos-latest
            electron_args: --mac --arm64
            artifact: TrueDeck-macos-arm64
            rust_target: ''
          - name: macos-x64
            os: macos-latest
            electron_args: --mac --x64
            artifact: TrueDeck-macos-x64
            rust_target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      # Sidecar is gitignored; every packaged build must compile it for this OS/arch.
      - name: Build Rust backend (host)
        if: matrix.rust_target == ''
        run: npm run build:backend

      - name: Build Rust backend (cross-target)
        if: matrix.rust_target != ''
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.rust_target }}"
          cargo build --release --target "${{ matrix.rust_target }}" \
            --manifest-path crates/truedeck-backend/Cargo.toml
          mkdir -p resources/bin
          cp "crates/truedeck-backend/target/${{ matrix.rust_target }}/release/truedeck-backend" \
            resources/bin/truedeck-backend
          ls -la resources/bin/

      - name: Build Electron app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.electron_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned OSS builds (no Apple Developer cert in CI).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # End-user installers only (no zip / blockmap / latest.yml auto-update noise).
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    # Tag push, or manual dispatch with an explicit release_tag.
    if: >
      always() &&
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) &&
      (needs.package.result == 'success' || needs.package.result == 'failure')
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: TrueDeck-*
          merge-multiple: true
          # Allow partial matrix success so arm64 can ship if one arch fails.
        continue-on-error: true

      - name: Collect installers only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          # Flatten and keep only user-facing installers.
          find dist -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 \
            | while IFS= read -r -d '' f; do
                cp -v "$f" "publish/$(basename "$f")"
              done
          count=$(find publish -type f | wc -l | tr -d ' ')
          echo "Installer files: $count"
          ls -la publish || true
          if [[ "${count}" -lt 1 ]]; then
            echo "No installer artifacts downloaded"
            exit 1
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            publish/*
          fail_on_unmatched_files: true
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
